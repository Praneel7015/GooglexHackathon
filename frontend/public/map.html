<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#e8e0d4}
  #map{width:100%;height:100%}
</style>
</head>
<body>
<div id="map"></div>
<script>
const API = new URLSearchParams(window.location.search).get('api') || 'http://localhost:8000';
const MODE = new URLSearchParams(window.location.search).get('mode') || 'clusters';

const map = L.map('map', { zoomControl: true }).setView([12.9716, 77.5946], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19,
  attribution: '&copy; OpenStreetMap &middot; CARTO'
}).addTo(map);

fetch(API + '/api/v1/dashboard/map?limit=500')
  .then(r => r.json())
  .then(data => {
    if (MODE === 'points') {
      data.complaints.forEach(c => {
        if (!c.lat || !c.lng) return;
        L.circleMarker([c.lat, c.lng], {
          radius: 5, weight: 1, color: '#2a221b',
          fillColor: c.status==='resolved'?'#71816d':c.status==='escalated'?'#c95a3c':'#342a21',
          fillOpacity: 0.8
        }).bindPopup('<b>'+c.issue_type+'</b><br>Ward '+c.ward_number+' · '+c.status).addTo(map);
      });
      return;
    }
    // Cluster mode: group by ward
    const wards = {};
    data.complaints.forEach(c => {
      const wn = c.ward_number || 0;
      if (!wards[wn]) wards[wn] = {name:c.ward_name||'Ward '+wn, ll:[c.lat,c.lng], open:0, resolved:0, total:0};
      wards[wn].total++;
      if (c.status==='open'||c.status==='escalated') wards[wn].open++;
      else wards[wn].resolved++;
    });
    Object.values(wards).forEach(w => {
      if (!w.ll[0]||!w.ll[1]) return;
      const rate = w.total>0 ? w.resolved/w.total : 0;
      const fill = rate>=0.5?'#71816d':rate>=0.2?'#c9b79c':'#342a21';
      const halo = rate>=0.5?'rgba(113,129,109,.35)':rate>=0.2?'rgba(201,183,156,.55)':'rgba(52,42,33,.28)';
      const count = w.open||w.total;
      const r = Math.max(18, Math.min(40, 12+Math.sqrt(count)*1.1));
      const inner = Math.max(10, r*0.5);
      const html = '<div style="position:relative;width:'+(r*2)+'px;height:'+(r*2)+'px;transform:translate(-50%,-50%)">'
        +'<div style="position:absolute;inset:0;border-radius:50%;background:'+halo+'"></div>'
        +'<div style="position:absolute;left:50%;top:50%;width:'+(inner*2)+'px;height:'+(inner*2)+'px;transform:translate(-50%,-50%);border-radius:50%;background:'+fill+';border:1.4px solid #2a221b;display:flex;align-items:center;justify-content:center;font-family:JetBrains Mono,monospace;font-size:'+(inner>12?11:9)+'px;font-weight:700;color:#fbf8f1">'+count+'</div>'
        +'<div style="position:absolute;left:50%;top:'+(r*2+2)+'px;transform:translateX(-50%);font-family:Caveat,cursive;font-size:13px;color:#342a21;white-space:nowrap;text-shadow:0 0 3px #f1e0c5,0 0 6px #f1e0c5">'+w.name+'</div>'
        +'</div>';
      L.marker(w.ll, {icon:L.divIcon({html:html,className:'',iconSize:[0,0]}), interactive:false}).addTo(map);
    });
  })
  .catch(e => {
    document.body.innerHTML = '<div style="padding:20px;color:red">Map load failed: '+e.message+'</div>';
  });
</script>
</body>
</html>
